# Render blueprint: the API (FastAPI), the website and the admin website (static React builds).
# NOT YET TESTED on Render. If the blueprint is rejected, create the two services by hand with the same settings (docs/SETUP.md).
# Variables marked `sync: false` are asked for when the blueprint is created; type secret values into Render yourself.
services:
  - type: web
    # In Singapore, the Render region closest to the Supabase database (Mumbai): every database question is a short trip.
    # (The first API service was created in Oregon by default; a service cannot change region, so this is a new one.)
    name: buildora-api-sg
    region: singapore
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL # SECRET: the Supabase Session pooler connection string. Type it into Render yourself.
        sync: false
      - key: CORS_ORIGINS # the website's AND the admin website's URLs, comma-separated, e.g. https://buildora-web.onrender.com,https://buildora-admin.onrender.com
        sync: false

  - type: web
    name: buildora-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL # the API's URL, no trailing slash
        sync: false
    routes:
      # single-page app: every path serves index.html so refreshes and deep links work
      - type: rewrite
        source: /*
        destination: /index.html

  # The admin website: same code base, built with `--mode admin`, its own address. Only Admins get past its login
  # (and the API and database refuse everyone else on their own).
  - type: web
    name: buildora-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:admin
    staticPublishPath: dist-admin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL # the API's URL, no trailing slash
        sync: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
